# PhaseLock on Physics-IQ: guided against unguided, on the paper's own benchmark.
#
#   python scripts/run_physics_iq.py --config configs/experiments/physics_iq.yaml
#
# CogVideoX-5B-I2V because the benchmark is image-conditioned and it is the only I2V
# checkpoint that fits a 46 GB card. Its geometry is fixed at 480x720 -- diffusers refuses
# any other for this checkpoint -- so data.height/width are left unset deliberately.
backend:
  name: cogvideox_5b_i2v
  dtype: bfloat16
  offload: true

data:
  name: physics_iq
  limit: null         # all 198 take-1 scenarios; override for a smoke test
  seed: 0

generation:
  num_steps: 50
  guidance_scale: 6.0
  seed: 42

# The paper's settings. `few_step_prior_type` is the axis this experiment varies;
# `motion` reproduces PhaseLock as published.
phaselock:
  few_steps: 2
  guidance_strength: 0.05
  guide_start: 0
  guide_end: 25
  few_step_prior_type: motion
  
  # Options: few_step, running_momentum
  prior_mode: running_momentum
  beta1: 0.9
  beta2: 0.999
  running_momentum_mode: residual # residual | snr
  running_momentum_source: blend # latent | x0_hat | blend 
  # latent: use the post-step latent as the source for the running momentum update
  # x0_hat: use the pre-step x0_hat as the source for the running momentum update
  # blend: blend the post-step latent and pre-step x0_hat as the source for the running momentum update

output:
  root: /data/experiments/phaselock_running_momentum
  name: physics_iq_test_running_momentum
