# Wan2.1-I2V-14B-480P on Physics-IQ, unguided baseline.
#
#   python scripts/run_physics_iq.py --config configs/experiments/physics_iq_wan21_i2v.yaml \
#     --guidance baseline -- output__root=/data/experiments/physics-iq/wan21-i2v
#
# 81 frames at 16 fps is 5.06 s, and the benchmark scores the first 5.000 s = 80 frames --
# so this backend covers the window almost exactly, where CogVideoX generates 6.125 s and
# is truncated.
#
# Settings are the checkpoint's own, from the diffusers example for this model. Nothing is
# borrowed from the CogVideoX config: a baseline is only a baseline at the operating point
# the model was released with.
backend:
  name: wan21_i2v_14b_480p
  dtype: bfloat16          # the VAE is forced to fp32 by the backend; its per-channel
  offload: true            # normalisation is fragile in bf16
data:
  name: physics_iq
  limit: null              # all 198 take-1 scenarios
  seed: 0

generation:
  num_steps: 50            # diffusers default for Wan2.1 I2V
  guidance_scale: 5.0      # ditto
  seed: 42                 # same seed as the CogVideoX runs
  negative_prompt: "low quality"

# Unused by --guidance baseline; kept so the file is a drop-in for a guided run later.
phaselock:
  few_steps: 2
  guidance_strength: 0.05
  guide_start: 0
  guide_end: 25
  few_step_prior_type: motion

output:
  name: physics_iq
